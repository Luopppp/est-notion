<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>EDT</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    padding: 20px;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: transparent;

    color: #222;
}

.widget {

    max-width: 520px;

    margin: auto;

    padding: 28px;

    border-radius: 24px;

    background: rgba(255,255,255,0.94);

    box-shadow:
        0 10px 40px rgba(0,0,0,0.08);
}

.label {

    font-size: 12px;

    text-transform: uppercase;

    letter-spacing: 1.5px;

    opacity: .5;

    margin-bottom: 8px;
}

.course {

    font-size: 30px;

    font-weight: 700;

    line-height: 1.15;

    margin-bottom: 10px;
}

.remaining {

    font-size: 38px;

    font-weight: 750;

    margin: 12px 0;
}

.info {

    font-size: 15px;

    opacity: .62;
}

.progress {

    height: 9px;

    width: 100%;

    background: #e8e8e8;

    border-radius: 20px;

    overflow: hidden;

    margin: 22px 0;
}

.bar {

    height: 100%;

    background: #222;

    border-radius: 20px;

    transition: width .5s ease;
}

.next {

    margin-top: 22px;

    padding-top: 20px;

    border-top: 1px solid #e9e9e9;
}

.next-title {

    font-size: 18px;

    font-weight: 650;
}

.small {

    font-size: 14px;

    opacity: .58;

    margin-top: 5px;
}

.finished {

    font-size: 28px;

    font-weight: 700;

    line-height: 1.2;
}

.error {

    font-size: 14px;

    line-height: 1.5;
}

@media (prefers-color-scheme: dark) {

    body {
        color: #eee;
    }

    .widget {
        background: rgba(35,35,35,.94);

        box-shadow:
            0 10px 40px rgba(0,0,0,.25);
    }

    .progress {
        background: #444;
    }

    .bar {
        background: #eee;
    }

    .next {
        border-color: #444;
    }
}

</style>

</head>

<body>

<div
    class="widget"
    id="widget"
>
    Chargement...
</div>


<script>


let events = [];


function escapeHTML(text) {

    return String(text)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
}


function formatTime(date) {

    return date.toLocaleTimeString(
        "fr-FR",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


function formatDuration(minutes) {

    minutes = Math.max(
        0,
        Math.ceil(minutes)
    );

    const hours =
        Math.floor(minutes / 60);

    const mins =
        minutes % 60;


    if (hours > 0) {

        return (
            hours +
            " h " +
            mins.toString().padStart(2, "0")
        );
    }


    return mins + " min";
}


function sameDay(a, b) {

    return (

        a.getFullYear() === b.getFullYear()

        &&

        a.getMonth() === b.getMonth()

        &&

        a.getDate() === b.getDate()
    );
}


function updateWidget() {

    const now = new Date();


    const today = events

        .map(event => ({

            title: event.title,

            start: new Date(event.start),

            end: new Date(event.end)

        }))

        .filter(event =>
            sameDay(event.start, now)
        )

        .sort(
            (a,b) =>
                a.start - b.start
        );


    const current = today.find(
        event =>
            now >= event.start &&
            now < event.end
    );


    const upcoming = today.find(
        event =>
            event.start > now
    );


    const last =
        today.length
            ? today[today.length - 1]
            : null;


    // ==============================================
    // COURS EN COURS
    // ==============================================

    if (current) {

        const remainingMs =
            current.end - now;

        const remainingMinutes =
            remainingMs / 60000;


        const total =
            current.end - current.start;


        const elapsed =
            now - current.start;


        const percentage =
            Math.max(
                0,
                Math.min(
                    100,
                    elapsed / total * 100
                )
            );


        let html = `

            <div class="label">
                📚 Cours actuel
            </div>

            <div class="course">
                ${escapeHTML(current.title)}
            </div>

            <div class="remaining">
                ${formatDuration(remainingMinutes)}
            </div>

            <div class="info">
                ⏳ temps restant ·
                fin à ${formatTime(current.end)}
            </div>

            <div class="progress">

                <div
                    class="bar"
                    style="width:${percentage}%"
                ></div>

            </div>

        `;


        if (upcoming) {

            const wait =
                (upcoming.start - now) / 60000;


            html += `

                <div class="next">

                    <div class="label">
                        🔜 Prochain cours
                    </div>

                    <div class="next-title">
                        ${escapeHTML(upcoming.title)}
                    </div>

                    <div class="small">
                        ${formatTime(upcoming.start)}
                        · dans
                        ${formatDuration(wait)}
                    </div>

                </div>

            `;
        }


        if (last) {

            html += `

                <div class="next">

                    <div class="label">
                        🏁 Fin des cours aujourd'hui
                    </div>

                    <div class="next-title">
                        ${formatTime(last.end)}
                    </div>

                </div>

            `;
        }


        document.getElementById(
            "widget"
        ).innerHTML = html;


        return;
    }


    // ==============================================
    // AVANT LE PROCHAIN COURS
    // ==============================================

    if (upcoming) {

        const wait =
            (upcoming.start - now) / 60000;


        document.getElementById(
            "widget"
        ).innerHTML = `

            <div class="label">
                ☕ Pas de cours actuellement
            </div>

            <div class="course">
                Prochain cours
            </div>

            <div class="remaining">
                ${formatDuration(wait)}
            </div>

            <div class="info">
                🔜 ${escapeHTML(upcoming.title)}
                · ${formatTime(upcoming.start)}
            </div>

            <div class="next">

                <div class="label">
                    🏁 Fin des cours aujourd'hui
                </div>

                <div class="next-title">
                    ${formatTime(last.end)}
                </div>

            </div>

        `;

        return;
    }


    // ==============================================
    // JOURNÉE TERMINÉE
    // ==============================================

    if (last) {

        document.getElementById(
            "widget"
        ).innerHTML = `

            <div class="finished">
                🎉 Journée terminée
            </div>

            <div class="info">
                Plus aucun cours aujourd'hui.
            </div>

        `;

        return;
    }


    // ==============================================
    // AUCUN COURS
    // ==============================================

    document.getElementById(
        "widget"
    ).innerHTML = `

        <div class="finished">
            😎 Aucun cours aujourd'hui
        </div>

    `;
}


// ==============================================
// CHARGEMENT DU CALENDRIER
// ==============================================

async function loadCalendar() {

    try {

        const response = await fetch(
            "calendar.json?t=" + Date.now()
        );


        if (!response.ok) {

            throw new Error(
                "calendar.json introuvable"
            );
        }


        const data =
            await response.json();


        events =
            data.events || [];


        updateWidget();

    }

    catch (error) {

        document.getElementById(
            "widget"
        ).innerHTML = `

            <div class="error">

                ❌ Impossible de charger
                l'emploi du temps.

                <br><br>

                Vérifie que le workflow
                GitHub a bien créé
                <strong>calendar.json</strong>.

            </div>

        `;
    }
}


// ==============================================
// ACTUALISATION
// ==============================================

// Le compteur se met à jour chaque minute.
setInterval(
    updateWidget,
    60000
);


// On recharge le calendrier toutes les 15 minutes.
setInterval(
    loadCalendar,
    900000
);


loadCalendar();

</script>

</body>

</html>
