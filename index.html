<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EDT</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      padding: 10px 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background: transparent;
      color: #1f1f1f;
    }

    .widget {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;

      padding: 10px 0;

      background: transparent;
      box-shadow: none;
      border-radius: 0;
    }

    .label {
      margin-bottom: 8px;

      font-size: 12px;
      font-weight: 600;

      letter-spacing: 1.4px;
      text-transform: uppercase;

      opacity: 0.5;
    }

    .course {
      margin-bottom: 10px;

      font-size: 30px;
      line-height: 1.15;
      font-weight: 750;

      word-break: break-word;
    }

    .remaining {
      margin: 14px 0 6px;

      font-size: 38px;
      line-height: 1.1;
      font-weight: 750;

      letter-spacing: -1px;
    }

    .info {
      font-size: 15px;
      line-height: 1.5;

      opacity: 0.62;
    }

    .progress {
      width: 100%;
      height: 8px;

      margin: 22px 0;

      overflow: hidden;

      border-radius: 20px;

      background: #e8e8e8;
    }

    .bar {
      width: 0%;
      height: 100%;

      border-radius: 20px;

      background: #222;

      transition: width 0.5s ease;
    }

    .next {
      margin-top: 22px;
      padding-top: 20px;

      border-top: 1px solid #e8e8e8;
    }

    .next-title {
      font-size: 18px;
      line-height: 1.3;
      font-weight: 650;

      word-break: break-word;
    }

    .small {
      margin-top: 5px;

      font-size: 14px;
      line-height: 1.5;

      opacity: 0.58;
    }

    .finished {
      font-size: 28px;
      line-height: 1.2;
      font-weight: 750;
    }

    .loading {
      font-size: 17px;
      opacity: 0.6;
    }

    .error {
      font-size: 14px;
      line-height: 1.6;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      margin-bottom: 12px;

      font-size: 13px;
      font-weight: 600;
    }

    .dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #333;
    }

    @media (prefers-color-scheme: dark) {

      body {
        color: #f1f1f1;
      }

      .progress {
        background: #454545;
      }

      .bar {
        background: #f1f1f1;
      }

      .next {
        border-color: #444;
      }

    }

  </style>

</head>


<body>

  <div
    id="widget"
    class="widget"
  >

    <div class="loading">
      Chargement de ton emploi du temps...
    </div>

  </div>


  <script>

    // =====================================================
    // DONNÉES
    // =====================================================

    let events = [];


    // =====================================================
    // OUTILS
    // =====================================================

    function escapeHTML(text) {

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function formatTime(date) {

      return date.toLocaleTimeString(
        "fr-FR",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    function formatDay(date) {

      const days = [
        "dimanche",
        "lundi",
        "mardi",
        "mercredi",
        "jeudi",
        "vendredi",
        "samedi"
      ];

      return days[date.getDay()];

    }


    function formatDate(date) {

      return date.toLocaleDateString(
        "fr-FR",
        {
          day: "numeric",
          month: "long"
        }
      );

    }


    function formatDuration(minutes) {

      minutes = Math.max(
        0,
        Math.ceil(minutes)
      );


      const hours =
        Math.floor(minutes / 60);


      const mins =
        minutes % 60;


      if (hours > 0) {

        if (mins === 0) {

          return hours + " h";

        }

        return (
          hours +
          " h " +
          String(mins).padStart(2, "0")
        );

      }


      return mins + " min";

    }


    function sameDay(dateA, dateB) {

      return (

        dateA.getFullYear() === dateB.getFullYear()

        &&

        dateA.getMonth() === dateB.getMonth()

        &&

        dateA.getDate() === dateB.getDate()

      );

    }


    function getEventsWithDates() {

      return events

        .map(event => {

          return {

            title: event.title,

            start: new Date(event.start),

            end: new Date(event.end)

          };

        })

        .filter(event => {

          return (
            !isNaN(event.start.getTime()) &&
            !isNaN(event.end.getTime()) &&
            event.end > event.start
          );

        })

        .sort((a, b) => {

          return a.start - b.start;

        });

    }


    // =====================================================
    // AFFICHAGE
    // =====================================================

    function updateWidget() {

      const widget =
        document.getElementById("widget");


      const now =
        new Date();


      const allEvents =
        getEventsWithDates();


      // ===================================================
      // COURS EN COURS
      // ===================================================

      const current =
        allEvents.find(event => {

          return (
            now >= event.start &&
            now < event.end
          );

        });


      if (current) {

        const remainingMinutes =
          (current.end - now) / 60000;


        const total =
          current.end - current.start;


        const elapsed =
          now - current.start;


        const progress =
          Math.max(
            0,
            Math.min(
              100,
              elapsed / total * 100
            )
          );


        const next =
          allEvents.find(event => {

            return event.start >= current.end;

          });


        const todayEvents =
          allEvents.filter(event => {

            return sameDay(
              event.start,
              now
            );

          });


        const last =
          todayEvents.length
            ? todayEvents[todayEvents.length - 1]
            : null;


        let html = `

          <div class="status">

            <span class="dot"></span>

            Cours en cours

          </div>


          <div class="course">

            ${escapeHTML(current.title)}

          </div>


          <div class="label">

            Temps restant

          </div>


          <div class="remaining">

            ${formatDuration(remainingMinutes)}

          </div>


          <div class="info">

            Fin à ${formatTime(current.end)}

          </div>


          <div class="progress">

            <div
              class="bar"
              style="width:${progress}%"
            ></div>

          </div>

        `;


        if (next) {

          const wait =
            (next.start - now) / 60000;


          html += `

            <div class="next">

              <div class="label">

                Prochain cours

              </div>


              <div class="next-title">

                ${escapeHTML(next.title)}

              </div>


              <div class="small">

                ${formatDay(next.start)}
                ${formatDate(next.start)}
                à ${formatTime(next.start)}

                · dans ${formatDuration(wait)}

              </div>

            </div>

          `;

        }


        if (last) {

          html += `

            <div class="next">

              <div class="label">

                Fin des cours aujourd'hui

              </div>


              <div class="next-title">

                ${formatTime(last.end)}

              </div>

            </div>

          `;

        }


        widget.innerHTML =
          html;


        return;

      }


      // ===================================================
      // PROCHAIN COURS
      // ===================================================

      const upcoming =
        allEvents.find(event => {

          return event.start > now;

        });


      if (upcoming) {

        const wait =
          (upcoming.start - now) / 60000;


        const todayEvents =
          allEvents.filter(event => {

            return sameDay(
              event.start,
              now
            );

          });


        // -----------------------------------------------
        // Il reste des cours aujourd'hui
        // -----------------------------------------------

        if (todayEvents.length > 0) {

          const last =
            todayEvents[todayEvents.length - 1];


          widget.innerHTML = `

            <div class="status">

              <span class="dot"></span>

              Pas de cours actuellement

            </div>


            <div class="label">

              Prochain cours

            </div>


            <div class="course">

              ${escapeHTML(upcoming.title)}

            </div>


            <div class="remaining">

              ${formatDuration(wait)}

            </div>


            <div class="info">

              Commence à
              ${formatTime(upcoming.start)}

            </div>


            <div class="next">

              <div class="label">

                Fin des cours aujourd'hui

              </div>


              <div class="next-title">

                ${formatTime(last.end)}

              </div>

            </div>

          `;


          return;

        }


        // -----------------------------------------------
        // Aucun cours aujourd'hui
        // -----------------------------------------------

        widget.innerHTML = `

          <div class="finished">

            Aucun cours aujourd'hui

          </div>


          <div class="next">

            <div class="label">

              Prochain cours

            </div>


            <div class="next-title">

              ${escapeHTML(upcoming.title)}

            </div>


            <div class="small">

              ${formatDay(upcoming.start)}
              ${formatDate(upcoming.start)}
              à ${formatTime(upcoming.start)}

              · dans ${formatDuration(wait)}

            </div>

          </div>

        `;


        return;

      }


      // ===================================================
      // PLUS AUCUN COURS
      // ===================================================

      const todayEvents =
        allEvents.filter(event => {

          return sameDay(
            event.start,
            now
          );

        });


      if (todayEvents.length > 0) {

        const last =
          todayEvents[todayEvents.length - 1];


        widget.innerHTML = `

          <div class="finished">

            Journée terminée

          </div>


          <div class="info"
               style="margin-top:10px;">

            Plus aucun cours aujourd'hui.

          </div>


          <div class="next">

            <div class="label">

              Dernier cours terminé à

            </div>


            <div class="next-title">

              ${formatTime(last.end)}

            </div>

          </div>

        `;


        return;

      }


      // ===================================================
      // CALENDRIER VIDE
      // ===================================================

      widget.innerHTML = `

        <div class="finished">

          Aucun cours programmé

        </div>

      `;

    }


    // =====================================================
    // CHARGEMENT DE CALENDAR.JSON
    // =====================================================

    async function loadCalendar() {

      try {

        const response =
          await fetch(
            "calendar.json?t=" +
            Date.now()
          );


        if (!response.ok) {

          throw new Error(
            "calendar.json introuvable"
          );

        }


        const data =
          await response.json();


        if (!Array.isArray(data.events)) {

          throw new Error(
            "Format du calendrier incorrect"
          );

        }


        events =
          data.events;


        updateWidget();

      }


      catch (error) {

        console.error(error);


        document.getElementById(
          "widget"
        ).innerHTML = `

          <div class="error">

            <strong>Impossible de charger l'EDT.</strong>

            <br><br>

            Le fichier
            <strong>calendar.json</strong>
            n'est pas disponible.

          </div>

        `;

      }

    }


    // =====================================================
    // ACTUALISATION
    // =====================================================

    // Actualise l'affichage toutes les minutes.
    setInterval(
      updateWidget,
      60000
    );


    // Recharge le calendrier Apple toutes les 15 minutes.
    setInterval(
      loadCalendar,
      900000
    );


    // Chargement initial.
    loadCalendar();

  </script>

</body>

</html>
