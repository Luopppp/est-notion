<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mon EDT</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: transparent;
        color: #222;
    }

    .widget {
        max-width: 500px;
        margin: auto;
        padding: 24px;
        border-radius: 20px;
        background: rgba(255,255,255,0.95);
        box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .label {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1px;
        opacity: 0.55;
        margin-bottom: 8px;
    }

    .course {
        font-size: 27px;
        font-weight: 700;
        margin-bottom: 8px;
    }

    .remaining {
        font-size: 35px;
        font-weight: 700;
        margin: 12px 0;
    }

    .info {
        font-size: 15px;
        opacity: 0.65;
    }

    .progress {
        width: 100%;
        height: 8px;
        background: #e8e8e8;
        border-radius: 20px;
        overflow: hidden;
        margin: 20px 0;
    }

    .bar {
        height: 100%;
        background: #222;
        transition: width 1s linear;
    }

    .next {
        margin-top: 20px;
        padding-top: 18px;
        border-top: 1px solid #eee;
    }

    .next-title {
        font-size: 18px;
        font-weight: 600;
    }

    .finished {
        font-size: 27px;
        font-weight: 700;
    }

    .small {
        font-size: 14px;
        opacity: 0.6;
        margin-top: 5px;
    }

    .error {
        font-size: 14px;
        line-height: 1.5;
    }
</style>
</head>

<body>

<div class="widget" id="widget">
    Chargement de ton emploi du temps...
</div>

<script>

// ======================================================
// CONFIGURATION
// ======================================================

// ⚠️ NE METS PAS TON LIEN ICLOUD ICI SI TON REPOSITORY
// EST PUBLIC.
// On le configurera ensuite autrement.

const CALENDAR_URL = "TON_LIEN_ICLOUD_ICI";


// ======================================================
// OUTILS
// ======================================================

function formatDuration(minutes) {
    if (minutes < 1) return "moins d'une minute";

    const h = Math.floor(minutes / 60);
    const m = minutes % 60;

    if (h > 0) {
        return `${h} h ${m.toString().padStart(2, "0")}`;
    }

    return `${m} min`;
}


function formatTime(date) {
    return date.toLocaleTimeString("fr-FR", {
        hour: "2-digit",
        minute: "2-digit"
    });
}


function sameDay(a, b) {
    return (
        a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate()
    );
}


// ======================================================
// PARSING ICS
// ======================================================

function parseICS(text) {

    const events = [];

    const blocks = text.split("BEGIN:VEVENT");

    for (let block of blocks.slice(1)) {

        const summaryMatch =
            block.match(/SUMMARY(?:;[^:]*)?:(.*)/);

        const startMatch =
            block.match(/DTSTART(?:;[^:]*)?:(.*)/);

        const endMatch =
            block.match(/DTEND(?:;[^:]*)?:(.*)/);

        if (!summaryMatch || !startMatch || !endMatch)
            continue;

        const summary = summaryMatch[1].trim();

        const start = parseICSDate(startMatch[1].trim());
        const end = parseICSDate(endMatch[1].trim());

        if (start && end) {
            events.push({
                title: summary,
                start,
                end
            });
        }
    }

    return events;
}


function parseICSDate(value) {

    value = value.replace(/\r/g, "");

    // Format UTC : 20260903T070000Z
    if (value.endsWith("Z")) {

        const clean = value.slice(0, -1);

        const y = Number(clean.slice(0,4));
        const mo = Number(clean.slice(4,6)) - 1;
        const d = Number(clean.slice(6,8));
        const h = Number(clean.slice(9,11));
        const mi = Number(clean.slice(11,13));
        const s = Number(clean.slice(13,15));

        return new Date(Date.UTC(y, mo, d, h, mi, s));
    }

    // Format local : 20260903T070000
    const y = Number(value.slice(0,4));
    const mo = Number(value.slice(4,6)) - 1;
    const d = Number(value.slice(6,8));
    const h = Number(value.slice(9,11));
    const mi = Number(value.slice(11,13));
    const s = Number(value.slice(13,15));

    return new Date(y, mo, d, h, mi, s);
}


// ======================================================
// AFFICHAGE
// ======================================================

function display(events) {

    const now = new Date();

    const today = events
        .filter(e => sameDay(e.start, now))
        .sort((a,b) => a.start - b.start);

    const current = today.find(e =>
        now >= e.start && now < e.end
    );

    const upcoming = today.find(e =>
        e.start > now
    );

    const last = today.length
        ? today[today.length - 1]
        : null;


    // --------------------------------------------------
    // COURS EN COURS
    // --------------------------------------------------

    if (current) {

        const remainingMs = current.end - now;
        const remainingMinutes =
            Math.ceil(remainingMs / 60000);

        const total =
            current.end - current.start;

        const elapsed =
            now - current.start;

        const percentage =
            Math.max(
                0,
                Math.min(
                    100,
                    (elapsed / total) * 100
                )
            );

        let html = `
            <div class="label">📚 Cours actuel</div>

            <div class="course">
                ${escapeHTML(current.title)}
            </div>

            <div class="remaining">
                ${formatDuration(remainingMinutes)}
            </div>

            <div class="info">
                ⏳ Temps restant · Fin à ${formatTime(current.end)}
            </div>

            <div class="progress">
                <div class="bar"
                     style="width:${percentage}%">
                </div>
            </div>
        `;

        if (upcoming) {

            const wait =
                Math.ceil(
                    (upcoming.start - now) / 60000
                );

            html += `
                <div class="next">

                    <div class="label">
                        🔜 Prochain cours
                    </div>

                    <div class="next-title">
                        ${escapeHTML(upcoming.title)}
                    </div>

                    <div class="small">
                        ${formatTime(upcoming.start)}
                        · dans ${formatDuration(wait)}
                    </div>

                </div>
            `;
        }

        if (last) {

            html += `
                <div class="next">

                    <div class="label">
                        🏁 Fin des cours aujourd'hui
                    </div>

                    <div class="next-title">
                        ${formatTime(last.end)}
                    </div>

                </div>
            `;
        }

        document.getElementById("widget").innerHTML = html;

        return;
    }


    // --------------------------------------------------
    // PROCHAIN COURS
    // --------------------------------------------------

    if (upcoming) {

        const wait =
            Math.ceil(
                (upcoming.start - now) / 60000
            );

        document.getElementById("widget").innerHTML = `

            <div class="label">
                ☕ Pas de cours actuellement
            </div>

            <div class="course">
                Prochain cours
            </div>

            <div class="remaining">
                ${formatDuration(wait)}
            </div>

            <div class="info">
                🔜 ${escapeHTML(upcoming.title)}
                · ${formatTime(upcoming.start)}
            </div>

            <div class="next">

                <div class="label">
                    🏁 Fin des cours aujourd'hui
                </div>

                <div class="next-title">
                    ${formatTime(last.end)}
                </div>

            </div>
        `;

        return;
    }


    // --------------------------------------------------
    // JOURNÉE TERMINÉE
    // --------------------------------------------------

    if (last) {

        document.getElementById("widget").innerHTML = `

            <div class="finished">
                🎉 Journée terminée
            </div>

            <div class="info">
                Plus aucun cours aujourd'hui.
            </div>

        `;

        return;
    }


    // --------------------------------------------------
    // AUCUN COURS
    // --------------------------------------------------

    document.getElementById("widget").innerHTML = `

        <div class="finished">
            😎 Aucun cours aujourd'hui
        </div>

    `;
}


// Sécurité pour les noms de cours
function escapeHTML(str) {
    return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


// ======================================================
// RÉCUPÉRATION DU CALENDRIER
// ======================================================

async function loadCalendar() {

    try {

        if (CALENDAR_URL === "TON_LIEN_ICLOUD_ICI") {

            document.getElementById("widget").innerHTML = `

                <div class="error">

                    ⚙️ <strong>Configuration nécessaire</strong>

                    <br><br>

                    Le widget est installé,
                    mais le calendrier iCloud n'est pas encore configuré.

                </div>
            `;

            return;
        }


        const response =
            await fetch(CALENDAR_URL);

        if (!response.ok)
            throw new Error("Impossible de récupérer le calendrier.");

        const text =
            await response.text();

        const events =
            parseICS(text);

        display(events);

    }

    catch(error) {

        document.getElementById("widget").innerHTML = `

            <div class="error">

                ❌ Impossible de charger ton calendrier.

                <br><br>

                ${error.message}

            </div>
        `;
    }
}


// ======================================================
// ACTUALISATION
// ======================================================

// Actualisation toutes les minutes
loadCalendar();

setInterval(loadCalendar, 60000);

</script>

</body>
</html>
