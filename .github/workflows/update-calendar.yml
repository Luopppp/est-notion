name: Mise à jour EDT

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  update-calendar:

    runs-on: ubuntu-latest

    steps:

      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Installer les dépendances
        run: |
          pip install icalendar recurring-ical-events

      - name: Récupérer le calendrier Apple
        env:
          CALENDAR_URL: ${{ secrets.CALENDAR_URL }}
        run: |
          python fetch_calendar.py

      - name: Vérifier les modifications
        id: changes
        run: |
          if git diff --quiet calendar.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Enregistrer le nouveau calendrier
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "EDT Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add calendar.json
          git commit -m "Mise à jour EDT"
          git push
